name: daily-claim

on:
  schedule:
    - cron: "0 * * * *"   # 每小時
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # =========================
      # 🟢 帳號 A
      # =========================
      - name: Restore auth A
        run: echo '${{ secrets.AUTH_STATE }}' > auth.json

      - name: Run claim A
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ACCOUNT_NAME: "各位原住民同胞大家好"
          ACCOUNT_ID: A
        run: node claim.js

      # =========================
      # 🟢 帳號 B
      # =========================
      - name: Restore auth B
        run: echo '${{ secrets.AUTH_STATE_ALT }}' > auth.json

      - name: Run claim B
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ACCOUNT_NAME: "食不食油餅"
          ACCOUNT_ID: B
        run: node claim.js

      # =========================
      # 🟢 更新 README
      # =========================
      - name: Update README status
        run: |
          node <<'NODE'
          const fs = require('fs');

          const accounts = [
            { id: 'A', name: '各位原住民同胞大家好' },
            { id: 'B', name: '食不食油餅' }
          ];

          function formatTime(value) {
            if (!value) return '尚無紀錄';

            return new Intl.DateTimeFormat('zh-TW', {
              timeZone: 'Asia/Taipei',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: false
            }).format(new Date(value)).replace(/\\//g, '-');
          }

          function loadState(id) {
            try {
              return JSON.parse(fs.readFileSync(`claim_state_${id}.json`, 'utf8'));
            } catch {
              return {};
            }
          }

          const rows = accounts.map(({ id, name }) => {
            const state = loadState(id);
            return `| ${name} | ${formatTime(state.lastClaimAt)} | ${state.lastResult || '尚無紀錄'} |`;
          }).join('\n');

          const readme = `# 🎮 荒野亂鬥自動領取

自動檢查並領取《荒野亂鬥》Supercell Store 可領取的獎勵。

## 📊 帳號狀態

| 帳號 | 上次簽到時間 | 簽到結果 |
| --- | --- | --- |
${rows}

> 時間以台灣時間（UTC+8）顯示。資料會由 GitHub Actions 自動更新。
`;

          fs.writeFileSync('README.md', readme);
          NODE

      # =========================
      # 🟢 Commit state + README（關鍵）
      # =========================
      - name: Commit state and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add claim_state_*.json README.md

          git diff --cached --quiet || git commit -m "update claim status"

          git push
